<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị - Thư viện Đoàn</title><link rel="stylesheet" href="/styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="/"><img src="/logo-doan.png"><span><b>THƯ VIỆN ĐOÀN</b><small>QUẢN TRỊ HỆ THỐNG</small></span></a><nav><a href="/">Xem website</a></nav></div></header><main class="wrap admin-page"><section id="login-box" class="panel login"><span class="eyebrow">QUẢN TRỊ</span><h1>Đăng nhập</h1><p>Dùng tài khoản Supabase Auth của quản trị viên.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mật khẩu"><button class="btn primary full" onclick="login()">Đăng nhập</button><div id="login-msg" class="msg"></div></section><section id="dashboard" hidden><div class="admin-head"><div><span class="eyebrow">DASHBOARD</span><h1>Quản lý thư viện</h1></div><button class="btn" onclick="logout()">Đăng xuất</button></div><div class="stats"><div><b id="stat-docs">0</b><span>Tài liệu</span></div><div><b id="stat-pdf">0</b><span>PDF</span></div><div><b id="stat-word">0</b><span>Word</span></div><div><b id="stat-downloads">0</b><span>Lượt tải</span></div></div><div class="admin-grid"><section class="panel"><h2>Upload tài liệu</h2><input id="doc-title" placeholder="Tên tài liệu"><select id="doc-category"></select><textarea id="doc-desc" placeholder="Mô tả"></textarea><input id="doc-file" type="file" accept=".pdf,.doc,.docx"><label class="check"><input id="doc-featured" type="checkbox"> Đưa lên tài liệu nổi bật</label><button class="btn primary" onclick="uploadDoc()">Upload tài liệu</button><div id="upload-msg" class="msg"></div></section><section class="panel"><h2>Thêm tin hoạt động</h2><input id="news-title" placeholder="Tiêu đề"><textarea id="news-content" rows="7" placeholder="Nội dung"></textarea><input id="news-image" placeholder="Link ảnh (không bắt buộc)"><button class="btn primary" onclick="addNews()">Đăng tin</button><div id="news-msg" class="msg"></div></section></div><section class="panel"><h2>Danh sách tài liệu</h2><div id="admin-docs">Đang tải...</div></section><section class="panel"><h2>Danh sách tin</h2><div id="admin-news">Đang tải...</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script><script src="/admin.js"></script></body></html>
